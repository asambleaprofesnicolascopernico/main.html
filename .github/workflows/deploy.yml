name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify exported JavaScript and CSS assets
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const basePath = process.env.NEXT_PUBLIC_BASE_PATH;
          const html = fs.readFileSync("out/index.html", "utf8");
          const assetUrls = [
            ...html.matchAll(
              /(?:src|href)="([^"]*\/_next\/static\/(?:css|chunks)\/[^"]+)"/g,
            ),
          ].map(([, url]) => url);
          const assetTypes = new Set();

          for (const assetUrl of assetUrls) {
            const pathname = new URL(assetUrl, "https://pages.invalid").pathname;
            const basePathPrefix = `${basePath}/`;

            if (!pathname.startsWith(basePathPrefix)) {
              throw new Error(`Asset URL is missing the Pages base path: ${assetUrl}`);
            }

            const outputPath = path.join("out", pathname.slice(basePathPrefix.length));

            if (!fs.existsSync(outputPath)) {
              throw new Error(`Referenced asset was not exported: ${outputPath}`);
            }

            if (pathname.endsWith(".css")) assetTypes.add("CSS");
            if (pathname.endsWith(".js")) assetTypes.add("JavaScript");
          }

          for (const assetType of ["CSS", "JavaScript"]) {
            if (!assetTypes.has(assetType)) {
              throw new Error(`No ${assetType} assets found in the exported homepage`);
            }
          }

          console.log("Exported homepage references existing CSS and JavaScript assets.");
          NODE
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
